name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install
        run: npm install

      - name: generate
        run: npm run generate

      - name: assert generated sources are committed
        run: |
          if ! git diff --quiet --exit-code src/parser.c src/grammar.json src/node-types.json; then
            echo "Generated sources are out of date. Run 'npm run generate' and commit the result." >&2
            git --no-pager diff src/parser.c src/grammar.json src/node-types.json
            exit 1
          fi

      - name: test
        run: npm test
